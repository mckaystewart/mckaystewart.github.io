# Rebuilds GitHub Pages on the days future-dated posts are due.
# Jekyll on GitHub Pages skips posts dated in the future, so each post goes
# live at the first build after its date/time. 22:05 UTC = 5:05 PM Eastern (EST) / 2:05 PM Pacific.
# Scheduled runs only act in 2026, so the cron does not repeat next year.
name: Scheduled Pages rebuild
on:
  schedule:
    - cron: "5 22 27,29 11 *"   # Nov 27 and Nov 29
    - cron: "5 22 1,3 12 *"     # Dec 1 and Dec 3
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Only run scheduled rebuilds in 2026
        id: year
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "Not 2026; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Request a Pages build
        if: steps.year.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
      - name: Wait for build
        if: steps.year.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            sleep 15
            s=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status || echo unknown)
            echo "status: $s"
            [ "$s" = built ] && exit 0
            [ "$s" = errored ] && exit 1
          done
          exit 1
      - name: Ping IndexNow with today's post
        if: steps.year.outputs.skip != 'true'
        run: |
          KEY=1f4c8588db48c5b78e449f01ec83d7e9
          D=$(TZ=America/New_York date +%Y/%m/%d)
          URLS=$(curl -s https://blog.mckaystewart.com/sitemap.xml | grep -o "https://blog.mckaystewart.com/$D/[^<]*" || true)
          [ -z "$URLS" ] && { echo "No post for $D in sitemap"; exit 0; }
          JSON=$(printf '%s\n' $URLS https://blog.mckaystewart.com/ | python3 -c 'import sys,json;print(json.dumps({"host":"blog.mckaystewart.com","key":"'$KEY'","keyLocation":"https://blog.mckaystewart.com/'$KEY'.txt","urlList":[l.strip() for l in sys.stdin if l.strip()]}))')
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -H "Content-Type: application/json" -d "$JSON" https://api.indexnow.org/indexnow
