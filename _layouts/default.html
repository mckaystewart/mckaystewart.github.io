<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="tagline">{{ site.tagline }}</span>
      <nav>
        <a href="{{ '/' | relative_url }}">Stories</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      &copy; {{ site.time | date: '%Y' }} McKay Stewart &middot;
      <a href="https://x.com/mckaystewart">X @mckaystewart</a> &middot;
      <a href="https://www.imdb.me/mckaystewart">IMDb</a> &middot;
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>
</body>
</html>
